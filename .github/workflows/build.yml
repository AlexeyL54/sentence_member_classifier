# .github/workflows/build-windows.yml
name: Build Windows (MSVC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtbase qttools'
        install-deps: 'true'

    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX=install

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      run: |
        cmake --install build --config Release

    - name: Copy Qt DLLs
      run: |
        # Копируем необходимые Qt DLL в папку с exe
        $qtBin = (Get-Command qmake).Path | Split-Path -Parent
        $dlls = @("Qt6Core.dll", "Qt6Widgets.dll", "Qt6Gui.dll")
        foreach ($dll in $dlls) {
          Copy-Item "$qtBin\$dll" -Destination "install/bin/" -ErrorAction SilentlyContinue
        }
        # Или используем windeployqt
        windeployqt --release install/bin/TextAnalyzer.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TextAnalyzer-Windows-x64
        path: install/
        retention-days: 30

    - name: Create Release (optional)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: TextAnalyzer-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
