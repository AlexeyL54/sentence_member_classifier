name: Build Windows (MSVC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Установка и инициализация vcpkg
    - name: Setup vcpkg
      shell: pwsh
      run: |
        Write-Host "📦 Setting up vcpkg..."
        $vcpkgPath = "${{ github.workspace }}/vcpkg"
        if (Test-Path $vcpkgPath) {
            Remove-Item -Path $vcpkgPath -Recurse -Force
        }
        git clone https://github.com/microsoft/vcpkg.git $vcpkgPath
        Set-Location $vcpkgPath
        .\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=$vcpkgPath" >> $env:GITHUB_ENV

    # Установка ICU
    - name: Install ICU
      shell: pwsh
      run: |
        Write-Host "📦 Installing ICU via vcpkg..."
        # Используем vcpkg для установки ICU
        ${{ github.workspace }}/vcpkg/vcpkg install icu:x64-windows
        echo "ICU_ROOT=${{ github.workspace }}/vcpkg/installed/x64-windows" >> $env:GITHUB_ENV

    # Установка Qt
    # ВАЖНО: Убрали параметры 'modules', так как они вызывают ошибку парсинга.
    # Базовые компоненты (Core, Widgets, Gui) устанавливаются по умолчанию.
    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        install-deps: 'true'
        dir: ${{ github.workspace }}/Qt

    # Скачивание и установка ONNX Runtime
    - name: Download and Setup ONNX Runtime
      shell: pwsh
      run: |
        # URL для скачивания pre-built ONNX Runtime для Windows (DirectML/CPU, MSVC 2019)
        $onnxRuntimeVersion = "1.24.4"
        $downloadUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$onnxRuntimeVersion/onnxruntime-win-x64-$onnxRuntimeVersion.zip"
        $downloadPath = "${{ github.workspace }}/onnxruntime.zip"
        $extractPath = "${{ github.workspace }}/onnxruntime"

        Write-Host "📥 Downloading ONNX Runtime v$onnxRuntimeVersion..."
        Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath

        Write-Host "📦 Extracting ONNX Runtime..."
        Expand-Archive -Path $downloadPath -DestinationPath $extractPath -Force

        # Перемещаем содержимое в корневую папку onnxruntime
        $extractedDir = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
        if ($extractedDir) {
            Move-Item -Path "$($extractedDir.FullName)\*" -Destination $extractPath -Force
            Remove-Item -Path $extractedDir.FullName -Recurse -Force
        }

        # Удаляем архив
        Remove-Item -Path $downloadPath -Force

        Write-Host "✅ ONNX Runtime installed to: $extractPath"
        Write-Host "📁 Contents:"
        Get-ChildItem -Path $extractPath | Select-Object Name | Format-Table

        # Сохраняем путь для использования в CMake
        echo "ONNXRUNTIME_ROOT=$extractPath" >> $env:GITHUB_ENV

    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 18 2026" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.5.0/msvc2019_64;${{ github.workspace }}/vcpkg/installed/x64-windows" `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DCMAKE_INSTALL_PREFIX=install

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      run: |
        cmake --install build --config Release

    - name: Deploy Qt DLLs (windeployqt)
      shell: pwsh
      run: |
        # 1. Находим windeployqt.exe
        # Action install-qt-action обычно добавляет Qt bin в PATH. Попробуем найти его там.
        $winDeployQt = Get-Command windeployqt.exe -ErrorAction SilentlyContinue

        if (-not $winDeployQt) {
            # Если не в PATH, пробуем стандартный путь установки действия
            $qtRoot = "C:\Qt\6.5.0\msvc2019_64"
            $winDeployQtPath = Join-Path $qtRoot "bin\windeployqt.exe"

            if (Test-Path $winDeployQtPath) {
                $winDeployQt = $winDeployQtPath
            } else {
                # Попытка найти в папке workspace, если action вел себя нестандартно
                $wsQtPath = "${{ github.workspace }}\Qt\6.5.0\msvc2019_64\bin\windeployqt.exe"
                if (Test-Path $wsQtPath) {
                    $winDeployQt = $wsQtPath
                } else {
                    Write-Error "❌ windeployqt.exe not found in PATH or standard locations."
                    exit 1
                }
            }
        } else {
            $winDeployQt = $winDeployQt.Source
        }

        Write-Host "🛠 Using windeployqt from: $winDeployQt"

        $appPath = "${{ github.workspace }}\install\bin\TextAnalyzer.exe"

        if (-not (Test-Path $appPath)) {
            Write-Error "❌ Application executable not found at: $appPath"
            exit 1
        }

        Write-Host "🚀 Running windeployqt..."
        # ДОБАВЛЕН ФЛАГ --no-translations
        & $winDeployQt --release --no-compiler-runtime --no-opengl-sw --no-translations "$appPath"

        if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ windeployqt failed with exit code $LASTEXITCODE"
            exit 1
        }
        Write-Host "✅ Qt dependencies deployed."

        # 2. Копирование ONNX Runtime DLL
        $onnxRoot = $env:ONNXRUNTIME_ROOT
        if (-not $onnxRoot) {
            Write-Error "❌ Environment variable ONNXRUNTIME_ROOT is not set."
            exit 1
        }

        $onnxLibPath = Join-Path $onnxRoot "lib"
        $onnxDllSource = Join-Path $onnxLibPath "onnxruntime.dll"
        $onnxDllDest = "${{ github.workspace }}\install\bin\onnxruntime.dll"

        Write-Host "🔍 Looking for ONNX Runtime DLL at: $onnxDllSource"

        if (Test-Path $onnxDllSource) {
            Copy-Item -Path $onnxDllSource -Destination $onnxDllDest -Force
            Write-Host "✅ ONNX Runtime DLL copied successfully."
        } else {
            Write-Host "❌ ONNX Runtime DLL not found at: $onnxDllSource"
            Write-Host "Contents of lib folder: "
            if (Test-Path $onnxLibPath) {
                Get-ChildItem -Path $onnxLibPath | Select-Object Name
            } else {
                Write-Host "Lib folder does not exist: $onnxLibPath"
            }
            exit 1
        }

        # 3. Копирование ICU DLL файлов
        $vcpkgRoot = "${{ github.workspace }}/vcpkg/installed/x64-windows"
        $icuBinPath = Join-Path $vcpkgRoot "bin"
        $installBinPath = "${{ github.workspace }}\install\bin"

        Write-Host "🔍 Looking for ICU DLLs at: $icuBinPath"

        if (Test-Path $icuBinPath) {
            # Копируем все ICU DLL файлы
            $icuDlls = Get-ChildItem -Path $icuBinPath -Filter "ic*.dll"
            if ($icuDlls.Count -gt 0) {
                foreach ($dll in $icuDlls) {
                    Write-Host "📋 Copying $($dll.Name)..."
                    Copy-Item -Path $dll.FullName -Destination $installBinPath -Force
                }
                Write-Host "✅ ICU DLLs copied successfully ($($icuDlls.Count) files)."
            } else {
                Write-Host "⚠️ No ICU DLL files found in $icuBinPath"
            }
        } else {
            Write-Host "⚠️ ICU bin folder does not exist: $icuBinPath"
        }

        Write-Host "✅ Deployment completed successfully!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TextAnalyzer-Windows-x64
        path: install/
        retention-days: 30
