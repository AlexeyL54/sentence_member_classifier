name: Build Windows (MSVC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Установка Qt
    # ВАЖНО: Убрали параметры 'modules', так как они вызывают ошибку парсинга.
    # Базовые компоненты (Core, Widgets, Gui) устанавливаются по умолчанию.
    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        install-deps: 'true'
        dir: ${{ github.workspace }}/Qt

    # Скачивание и установка ONNX Runtime
    - name: Download and Setup ONNX Runtime
      shell: pwsh
      run: |
        # URL для скачивания pre-built ONNX Runtime для Windows (DirectML/CPU, MSVC 2019)
        $onnxRuntimeVersion = "1.16.0"
        $downloadUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$onnxRuntimeVersion/onnxruntime-win-x64-$onnxRuntimeVersion.zip"
        $downloadPath = "${{ github.workspace }}/onnxruntime.zip"
        $extractPath = "${{ github.workspace }}/onnxruntime"

        Write-Host "📥 Downloading ONNX Runtime v$onnxRuntimeVersion..."
        Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath

        Write-Host "📦 Extracting ONNX Runtime..."
        Expand-Archive -Path $downloadPath -DestinationPath $extractPath -Force

        # Перемещаем содержимое в корневую папку onnxruntime
        $extractedDir = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
        if ($extractedDir) {
            Move-Item -Path "$($extractedDir.FullName)\*" -Destination $extractPath -Force
            Remove-Item -Path $extractedDir.FullName -Recurse -Force
        }

        # Удаляем архив
        Remove-Item -Path $downloadPath -Force

        Write-Host "✅ ONNX Runtime installed to: $extractPath"
        Write-Host "📁 Contents:"
        Get-ChildItem -Path $extractPath | Select-Object Name | Format-Table

        # Сохраняем путь для использования в CMake
        echo "ONNXRUNTIME_ROOT=$extractPath" >> $env:GITHUB_ENV

    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.5.0/msvc2019_64" `
          -Donnxruntime_INCLUDE_DIRS="${{ github.workspace }}/onnxruntime/include" `
          -Donnxruntime_LIB_DIRS="${{ github.workspace }}/onnxruntime/lib" `
          -DCMAKE_INSTALL_PREFIX=install

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      run: |
        cmake --install build --config Release

    - name: Deploy Qt DLLs (windeployqt)
      run: |
        # 1. Добавляем путь к утилитам Qt в PATH
        $qtBinPath = "${{ github.workspace }}/Qt/6.5.0/msvc2019_64/bin"
        $env:PATH = "$qtBinPath;$env:PATH"
        
        # 2. Путь к вашему исполняемому файлу
        $exePath = "${{ github.workspace }}/install/bin/TextAnalyzer.exe"
        
        Write-Host "🚀 Starting deployment for: $exePath"
        
        if (!(Test-Path $exePath)) {
            Write-Error "❌ Ошибка: Файл $exePath не найден. Проверьте шаг 'Install'."
            exit 1
        }

        # 3. Запуск windeployqt
        # --release: используем релизные версии DLL
        # --force: перезаписывать существующие файлы
        # --no-translations: НЕ копировать файлы переводов (.qm), так как интерфейс только на русском
        # --no-compiler-runtime: не пытаться копировать VC++ редистрибьютив (избегаем ошибок без VCINSTALLDIR)
        windeployqt --release --force --no-translations --no-compiler-runtime "$exePath"
        
        if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ windeployqt завершился с ошибкой (код $LASTEXITCODE)"
            exit 1
        }

        # 4. Копируем ONNX Runtime DLL
        $onnxDllSource = "${{ github.workspace }}/onnxruntime/bin/onnxruntime.dll"
        $onnxDllDest = "${{ github.workspace }}/install/bin/onnxruntime.dll"

        if (Test-Path $onnxDllSource) {
            Copy-Item -Path $onnxDllSource -Destination $onnxDllDest
            Write-Host "✅ ONNX Runtime DLL скопирован в install/bin"
        } else {
            Write-Warning "⚠️ ONNX Runtime DLL не найден по пути $onnxDllSource"
        }
        
        Write-Host "✅ Деплой успешно завершен!"
        Write-Host "📦 Размер папки install/bin:"
        Get-ChildItem "${{ github.workspace }}/install/bin" -Recurse | Measure-Object -Property Length -Sum | ForEach-Object { "{0:N2} MB" -f ($_.Sum / 1MB) }

      working-directory: ${{ github.workspace }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TextAnalyzer-Windows-x64
        path: install/
        retention-days: 30
