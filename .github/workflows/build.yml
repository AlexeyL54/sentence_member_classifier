name: Build Windows (MSVC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Установка Qt
    # ВАЖНО: Убрали параметры 'modules', так как они вызывают ошибку парсинга.
    # Базовые компоненты (Core, Widgets, Gui) устанавливаются по умолчанию.
    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        # modules: 'qtbase qttools'  <-- ЭТУ СТРОКУ НУЖНО УДАЛИТЬ или закомментировать
        install-deps: 'true'
        dir: ${{ github.workspace }}/Qt

    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.5.0/msvc2019_64" `
          -DCMAKE_INSTALL_PREFIX=install

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      run: |
        cmake --install build --config Release

    - name: Deploy Qt DLLs (windeployqt)
      run: |
        # 1. Добавляем путь к bin Qt в PATH
        $qtBinPath = "${{ github.workspace }}/Qt/6.5.0/msvc2019_64/bin"
        $env:PATH = "$qtBinPath;$env:PATH"
        
        # 2. Переходим в директорию с исполняемым файлом.
        # Это решает проблему "Cannot open .: Access is denied", 
        # так как теперь "." ссылается на папку install/bin, куда у нас есть права записи.
        $deployDir = "${{ github.workspace }}/install/bin"
        Set-Location $deployDir
        
        Write-Host "Working directory changed to: $pwd"
        Write-Host "Target executable: TextAnalyzer.exe"

        # 3. Очищаем папку translations, если она существует, чтобы избежать ошибок прав доступа при создании .qm файлов
        $transPath = Join-Path $pwd "translations"
        if (Test-Path $transPath) {
            Write-Host "Removing existing translations folder to prevent access errors..."
            Remove-Item -Path $transPath -Recurse -Force
        }

        # 4. Запускаем windeployqt
        # Мы находимся внутри папки bin, поэтому указываем просто имя файла.
        # --force гарантирует перезапись существующих DLL.
        # --no-compiler-runtime добавлен, чтобы игнорировать отсутствие VCINSTALLDIR (предупреждение в логе) и не падать из-за этого.
        windeployqt --release --force --no-compiler-runtime TextAnalyzer.exe
        
        if ($LASTEXITCODE -ne 0) {
            Write-Error "windeployqt failed with exit code $LASTEXITCODE"
            exit 1
        }

      # Важно: working-directory здесь можно не указывать, так как мы делаем Set-Location внутри скрипта,
      # но для чистоты можно оставить корень репозитория.
      working-directory: ${{ github.workspace }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TextAnalyzer-Windows-x64
        path: install/
        retention-days: 30
