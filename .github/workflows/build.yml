name: Build Windows (MSVC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Установка Qt
    # ВАЖНО: Убрали параметры 'modules', так как они вызывают ошибку парсинга.
    # Базовые компоненты (Core, Widgets, Gui) устанавливаются по умолчанию.
    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        # modules: 'qtbase qttools'  <-- ЭТУ СТРОКУ НУЖНО УДАЛИТЬ или закомментировать
        install-deps: 'true'
        dir: ${{ github.workspace }}/Qt

    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.5.0/msvc2019_64" `
          -DCMAKE_INSTALL_PREFIX=install

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      run: |
        cmake --install build --config Release

    - name: Deploy Qt DLLs (windeployqt)
      run: |
        # 1. Добавляем путь к bin Qt в PATH
        $qtBinPath = "${{ github.workspace }}/Qt/6.5.0/msvc2019_64/bin"
        $env:PATH = "$qtBinPath;$env:PATH"
        
        # 2. Формируем абсолютный путь к исполняемому файлу
        $exePath = "${{ github.workspace }}/install/bin/TextAnalyzer.exe"
        
        # Проверка существования файла перед запуском (для отладки)
        if (!(Test-Path $exePath)) {
            Write-Error "Файл $exePath не найден! Проверьте шаг Install."
            exit 1
        }

        # 3. Запускаем windeployqt
        # Используем --force чтобы перезаписывать файлы при повторных запусках
        # --no-translations можно добавить, если переводы не нужны или вызывают ошибки прав доступа
        windeployqt --release --force "$exePath"
        
        # Если нужны переводы и предыдущая команда упала на них, попробуйте запустить отдельно или проверить права папки translations
        # В вашем логе ошибка была на "Creating qt_ar.qm", возможно, стоит очистить папку переводов перед деплоем, если она кэшируется
        Remove-Item -Path "${{ github.workspace }}/install/bin/translations" -Recurse -Force -ErrorAction SilentlyContinue
        windeployqt --release --force "$exePath"

      working-directory: ${{ github.workspace }}        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TextAnalyzer-Windows-x64
        path: install/
        retention-days: 30
