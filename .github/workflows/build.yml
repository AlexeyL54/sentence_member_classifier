name: Build Windows (MSVC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Установка Qt
    # ВАЖНО: Убрали параметры 'modules', так как они вызывают ошибку парсинга.
    # Базовые компоненты (Core, Widgets, Gui) устанавливаются по умолчанию.
    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        install-deps: 'true'
        dir: ${{ github.workspace }}/Qt

    # Скачивание и установка ONNX Runtime
    - name: Download and Setup ONNX Runtime
      shell: pwsh
      run: |
        $onnxRuntimeVersion = "1.16.0"
        $downloadUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$onnxRuntimeVersion/onnxruntime-win-x64-$onnxRuntimeVersion.zip"
        $downloadPath = "${{ github.workspace }}/onnxruntime.zip"
        $extractBase = "${{ github.workspace }}/onnxruntime_tmp"
        $finalPath = "${{ github.workspace }}/onnxruntime"

        Write-Host "Downloading ONNX Runtime..."
        Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath

        Write-Host "Extracting..."
        Expand-Archive -Path $downloadPath -DestinationPath $extractBase -Force

        # Находим извлеченную папку (обычно onnxruntime-win-x64-1.16.0)
        $extractedDir = Get-ChildItem -Path $extractBase -Directory | Select-Object -First 1
        
        if ($extractedDir) {
            # Переименовываем/Перемещаем её в целевую папку, сохраняя внутреннюю структуру
            Move-Item -Path $extractedDir.FullName -Destination $finalPath -Force
        } else {
            # Fallback, если архив без корневой папки
            New-Item -ItemType Directory -Force -Path $finalPath
            Move-Item -Path "$extractBase/*" -Destination $finalPath -Force
        }

        # Очистка
        Remove-Item -Path $downloadPath -Force
        Remove-Item -Path $extractBase -Recurse -Force

        Write-Host "✅ ONNX Runtime installed to: $finalPath"
        
        # Проверка правильной структуры
        if (Test-Path "$finalPath/include/onnxruntime/onnxruntime_cxx_api.h") {
            Write-Host "✅ Structure is correct: include/onnxruntime/onnxruntime_cxx_api.h exists"
        } else {
            Write-Host "❌ Structure is WRONG. Listing include dir:"
            Get-ChildItem -Path "$finalPath/include" -Recurse | Select-Object FullName
            throw "Invalid ONNX Runtime structure"
        }

        echo "ONNXRUNTIME_ROOT=$finalPath" >> $env:GITHUB_ENV

    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.5.0/msvc2019_64" `
          -DCMAKE_INSTALL_PREFIX=install
          # Убрали явную передачу onnxruntime_INCLUDE_DIRS и LIB_DIRS
          # FindONNXRUNTIME.cmake найдет их сам через $ENV{ONNXRUNTIME_ROOT}

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      run: |
        cmake --install build --config Release

    - name: Deploy Qt DLLs (windeployqt)
      run: |
        # 1. Добавляем путь к утилитам Qt в PATH
        $qtBinPath = "${{ github.workspace }}/Qt/6.5.0/msvc2019_64/bin"
        $env:PATH = "$qtBinPath;$env:PATH"
        
        # 2. Путь к вашему исполняемому файлу
        $exePath = "${{ github.workspace }}/install/bin/TextAnalyzer.exe"
        
        Write-Host "🚀 Starting deployment for: $exePath"
        
        if (!(Test-Path $exePath)) {
            Write-Error "❌ Ошибка: Файл $exePath не найден. Проверьте шаг 'Install'."
            exit 1
        }

        # 3. Запуск windeployqt
        # --release: используем релизные версии DLL
        # --force: перезаписывать существующие файлы
        # --no-translations: НЕ копировать файлы переводов (.qm), так как интерфейс только на русском
        # --no-compiler-runtime: не пытаться копировать VC++ редистрибьютив (избегаем ошибок без VCINSTALLDIR)
        windeployqt --release --force --no-translations --no-compiler-runtime "$exePath"
        
        if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ windeployqt завершился с ошибкой (код $LASTEXITCODE)"
            exit 1
        }

        # 4. Копируем ONNX Runtime DLL
        $onnxDllSource = "${{ github.workspace }}/onnxruntime/bin/onnxruntime.dll"
        $onnxDllDest = "${{ github.workspace }}/install/bin/onnxruntime.dll"

        if (Test-Path $onnxDllSource) {
            Copy-Item -Path $onnxDllSource -Destination $onnxDllDest
            Write-Host "✅ ONNX Runtime DLL скопирован в install/bin"
        } else {
            Write-Warning "⚠️ ONNX Runtime DLL не найден по пути $onnxDllSource"
        }
        
        Write-Host "✅ Деплой успешно завершен!"
        Write-Host "📦 Размер папки install/bin:"
        Get-ChildItem "${{ github.workspace }}/install/bin" -Recurse | Measure-Object -Property Length -Sum | ForEach-Object { "{0:N2} MB" -f ($_.Sum / 1MB) }

      working-directory: ${{ github.workspace }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TextAnalyzer-Windows-x64
        path: install/
        retention-days: 30
