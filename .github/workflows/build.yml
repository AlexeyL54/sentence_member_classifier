name: Build Windows (MSVC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Установка Qt
    # ВАЖНО: Убрали параметры 'modules', так как они вызывают ошибку парсинга.
    # Базовые компоненты (Core, Widgets, Gui) устанавливаются по умолчанию.
    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        # modules: 'qtbase qttools'  <-- ЭТУ СТРОКУ НУЖНО УДАЛИТЬ или закомментировать
        install-deps: 'true'
        dir: ${{ github.workspace }}/Qt

    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.5.0/msvc2019_64" `
          -DCMAKE_INSTALL_PREFIX=install

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      run: |
        cmake --install build --config Release

    - name: Deploy Qt DLLs (windeployqt)
      run: |
        # Добавляем путь к bin Qt в PATH, чтобы найти windeployqt
        $env:PATH = "${{ github.workspace }}/Qt/6.5.0/msvc2019_64/bin;$env:PATH"
        
        # Запускаем утилиту деплоя для копирования всех зависимостей
        windeployqt --release --no-compiler-runtime install/bin/TextAnalyzer.exe
        
        # Опционально: копируем среду выполнения Visual C++ (если нужно, обычно лучше установить редистрибьютив на ПК пользователя)
        # Но для портативности можно попробовать скопировать vcruntime, если он есть в путях системы
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TextAnalyzer-Windows-x64
        path: install/
        retention-days: 30
