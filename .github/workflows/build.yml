name: Build Windows (MSVC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Установка Qt
    # ВАЖНО: Убрали параметры 'modules', так как они вызывают ошибку парсинга.
    # Базовые компоненты (Core, Widgets, Gui) устанавливаются по умолчанию.
    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        install-deps: 'true'
        dir: ${{ github.workspace }}/Qt

    # Скачивание и установка ONNX Runtime
    - name: Download and Setup ONNX Runtime
      shell: pwsh
      run: |
        # URL для скачивания pre-built ONNX Runtime для Windows (DirectML/CPU, MSVC 2019)
        $onnxRuntimeVersion = "1.16.0"
        $downloadUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$onnxRuntimeVersion/onnxruntime-win-x64-$onnxRuntimeVersion.zip"
        $downloadPath = "${{ github.workspace }}/onnxruntime.zip"
        $extractPath = "${{ github.workspace }}/onnxruntime"

        Write-Host "📥 Downloading ONNX Runtime v$onnxRuntimeVersion..."
        Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath

        Write-Host "📦 Extracting ONNX Runtime..."
        Expand-Archive -Path $downloadPath -DestinationPath $extractPath -Force

        # Перемещаем содержимое в корневую папку onnxruntime
        $extractedDir = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
        if ($extractedDir) {
            Move-Item -Path "$($extractedDir.FullName)\*" -Destination $extractPath -Force
            Remove-Item -Path $extractedDir.FullName -Recurse -Force
        }

        # Удаляем архив
        Remove-Item -Path $downloadPath -Force

        Write-Host "✅ ONNX Runtime installed to: $extractPath"
        Write-Host "📁 Contents:"
        Get-ChildItem -Path $extractPath | Select-Object Name | Format-Table

        # Сохраняем путь для использования в CMake
        echo "ONNXRUNTIME_ROOT=$extractPath" >> $env:GITHUB_ENV

    - name: Debug ONNX Structure
      shell: pwsh
      run: |
        Write-Host "=== Checking ONNX Runtime Structure ==="
        $root = $env:ONNXRUNTIME_ROOT
        Write-Host "Root: $root"
        
        if (Test-Path "$root/include/onnxruntime/onnxruntime_cxx_api.h") {
            Write-Host "✅ Header found: $root/include/onnxruntime/onnxruntime_cxx_api.h"
        } else {
            Write-Host "❌ Header NOT found at expected path!"
            Write-Host "Listing include directory:"
            Get-ChildItem -Path "$root/include" -Recurse | Select-Object FullName
        }

        if (Test-Path "$root/lib/onnxruntime.lib") {
            Write-Host "✅ Lib found: $root/lib/onnxruntime.lib"
        } else {
            Write-Host "❌ Lib NOT found!"
            Get-ChildItem -Path "$root/lib" | Select-Object Name
        }

    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.5.0/msvc2019_64" `
          -DCMAKE_INSTALL_PREFIX=install
          # Убрали явную передачу onnxruntime_INCLUDE_DIRS и LIB_DIRS
          # FindONNXRUNTIME.cmake найдет их сам через $ENV{ONNXRUNTIME_ROOT}

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      run: |
        cmake --install build --config Release

    - name: Deploy Qt DLLs (windeployqt)
      shell: pwsh
      run: |
        # 1. Запуск windeployqt для Qt
        $qtBinPath = "${{ github.workspace }}/Qt/6.5.0/msvc2019_64/bin"
        $appPath = "${{ github.workspace }}/install/bin/TextAnalyzer.exe"
        
        Write-Host "🚀 Running windeployqt..."
        & "$qtBinPath/windeployqt.exe" --release --no-compiler-runtime --no-opengl-sw "$appPath"
        
        if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ windeployqt failed with exit code $LASTEXITCODE"
            exit 1
        }
        Write-Host "✅ Qt dependencies deployed."

        # 2. Копирование ONNX Runtime DLL
        # Мы знаем, что ONNXRUNTIME_ROOT установлен в предыдущем шаге
        $onnxRoot = $env:ONNXRUNTIME_ROOT
        $onnxLibPath = Join-Path $onnxRoot "lib"
        $onnxDllSource = Join-Path $onnxLibPath "onnxruntime.dll"
        $onnxDllDest = "${{ github.workspace }}/install/bin/onnxruntime.dll"

        Write-Host "🔍 Looking for ONNX Runtime DLL at: $onnxLibPath"
        
        if (Test-Path $onnxLibPath) {
            Write-Host "📂 Contents of lib folder:"
            Get-ChildItem -Path $onnxLibPath | Select-Object Name
        }

        if (Test-Path $onnxDllSource) {
            Copy-Item -Path $onnxDllSource -Destination $onnxDllDest -Force
            Write-Host "✅ ONNX Runtime DLL copied successfully from manual install."
        } else {
            Write-Error "❌ ONNX Runtime DLL not found at expected path: $onnxDllSource"
            exit 1
        }
        
        Write-Host "✅ Deployment completed successfully!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TextAnalyzer-Windows-x64
        path: install/
        retention-days: 30
