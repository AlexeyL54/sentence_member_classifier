name: Build Windows (MSVC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Установка Qt
    # ВАЖНО: Убрали параметры 'modules', так как они вызывают ошибку парсинга.
    # Базовые компоненты (Core, Widgets, Gui) устанавливаются по умолчанию.
    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        install-deps: 'true'
        dir: ${{ github.workspace }}/Qt

    # Скачивание и установка ONNX Runtime
    - name: Setup vcpkg and install ONNX Runtime
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '2024.02.14'  # Зафиксируем версию для воспроизводимости
        vcpkgTriplet: 'x64-windows'
        vcpkgArguments: 'onnxruntime'

    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.5.0/msvc2019_64" `
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_INSTALL_PREFIX=install

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      run: |
        cmake --install build --config Release

    - name: Deploy Qt DLLs (windeployqt)
      run: |
        # ... предыдущий код для Qt ...
        
        # 4. Копируем ONNX Runtime DLL из vcpkg
        # vcpkg устанавливает DLL в: ${{ env.VCPKG_ROOT }}/installed/x64-windows/bin/
        $onnxDllSource = "${{ env.VCPKG_ROOT }}/installed/x64-windows/bin/onnxruntime.dll"
        $onnxDllDest = "${{ github.workspace }}/install/bin/onnxruntime.dll"

        if (Test-Path $onnxDllSource) {
            Copy-Item -Path $onnxDllSource -Destination $onnxDllDest
            Write-Host "✅ ONNX Runtime DLL скопирован из vcpkg"
        } else {
            # Пробуем альтернативный путь (если используется статическая сборка или другая конфигурация)
            Write-Warning "⚠️ DLL не найден по основному пути, ищем альтернативы..."
            $altPath = "${{ env.VCPKG_ROOT }}/installed/x64-windows/debug/bin/onnxruntime.dll"
            if (Test-Path $altPath) {
                Copy-Item -Path $altPath -Destination $onnxDllDest
                Write-Host "✅ ONNX Runtime DLL скопирован из debug-папки"
            } else {
                Write-Error "❌ ONNX Runtime DLL не найден ни в одном из путей"
                exit 1
            }
        }
        
        Write-Host "✅ Деплой успешно завершен!"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TextAnalyzer-Windows-x64
        path: install/
        retention-days: 30
