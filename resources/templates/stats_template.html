<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика синтаксического анализа текста</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="stats_styles.css">
</head>
<body>
    <div class="container">
        <h1>Статистика синтаксического анализа текста</h1>
        
        <div class="stats-summary" id="statsSummary">
            <!-- Statistics will be inserted here -->
        </div>
        
        <div class="charts-grid">
            <div class="chart-card">
                <h3>Распределение членов предложения</h3>
                <canvas id="membersChart"></canvas>
            </div>
        </div>
        
        <div class="top-items" id="topItems">
            <!-- Top items will be inserted here -->
        </div>
        
        <div class="footer">
            Giga Голиков AI
        </div>
    </div>
    
    <script src="stats_script.js"></script>
</body>
</html>
